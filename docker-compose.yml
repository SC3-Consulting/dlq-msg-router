services:
  # The Autonomous DLQ Triage Pipeline
  dlq-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonomous-dlq-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Commented out to force DefaultAzureCredential to fall back to Azure CLI
      # - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      # - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      # - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      # Force routing to the host machine's native Ollama instance to utilise hardware acceleration
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434/api/generate
      - SERVICE_BUS_CONNECTION_STRING=${SERVICE_BUS_CONNECTION_STRING:-}
      - ENABLE_HEALTH_ENDPOINTS=true
      - HEALTHCHECK_HOST=0.0.0.0
      - HEALTHCHECK_PORT=8080
      - ENABLE_DEPENDENCY_WAIT=${ENABLE_DEPENDENCY_WAIT:-true}
      - DEPENDENCY_WAIT_TIMEOUT_SECONDS=${DEPENDENCY_WAIT_TIMEOUT_SECONDS:-120}
      - SHUTDOWN_TIMEOUT_SECONDS=30
      - MAX_CONCURRENT_QUEUES=${MAX_CONCURRENT_QUEUES:-2}
      - ASB_MAX_MESSAGE_COUNT=${ASB_MAX_MESSAGE_COUNT:-10}
      - ASB_MAX_WAIT_TIME=${ASB_MAX_WAIT_TIME:-5}
      - PREFETCH_COUNT=${PREFETCH_COUNT:-20}
      - AGENT_CYCLE_SLEEP_SECONDS=${AGENT_CYCLE_SLEEP_SECONDS:-30}
      - DRAIN_RETRY_MAX_ATTEMPTS=${DRAIN_RETRY_MAX_ATTEMPTS:-3}
      - DRAIN_BACKOFF_BASE_SECONDS=${DRAIN_BACKOFF_BASE_SECONDS:-1.0}
      - DRAIN_BACKOFF_MAX_SECONDS=${DRAIN_BACKOFF_MAX_SECONDS:-30.0}
    volumes:
      # Named volumes avoid host-path and permission issues in Docker-outside-of-Docker setups.
      - dlq_agent_data:/app/data
      - dlq_agent_reports:/app/reports
    # Cross-platform networking standard to reach local native services from inside the container
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

  # Optional: Azure Service Bus local emulator stack (opt-in via --profile asb-emulator)
  servicebus-emulator:
    profiles: ["asb-emulator"]
    container_name: servicebus-emulator
    build:
      context: ./infra/local/servicebus-emulator
      dockerfile: Dockerfile
    image: local/servicebus-emulator:dev
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      EMULATOR_HTTP_PORT: ${EMULATOR_HTTP_PORT:-5300}
    ports:
      - "5672:5672"
      - "${EMULATOR_HTTP_PORT:-5300}:${EMULATOR_HTTP_PORT:-5300}"
    depends_on:
      - mssql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mssql:
    profiles: ["asb-emulator"]
    container_name: mssql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
  # Local Observability: Grafana UI connected to Azure Log Analytics
  # Blast radius: Read-only UI layer. Does not modify Azure state or agent execution.
  # Trade-off: Anonymous admin access is enabled for frictionless local dev; do not deploy this configuration to the cloud.
  grafana:
    image: grafana/grafana:11.2.2
    container_name: dlq-grafana
    restart: unless-stopped
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        if [ -z "$$LOG_ANALYTICS_WORKSPACE_ID" ]; then
          echo "LOG_ANALYTICS_WORKSPACE_ID is required" >&2
          exit 1
        fi
        mkdir -p /var/lib/grafana/dashboards
        for template in /etc/grafana/dashboard-templates/*.json; do
          [ -e "$$template" ] || continue
          output="/var/lib/grafana/dashboards/$$(basename "$$template")"
          sed "s|@@LOG_ANALYTICS_WORKSPACE_ID@@|$$LOG_ANALYTICS_WORKSPACE_ID|g" "$$template" > "$$output"
        done
        exec /run.sh
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AZURE_MANAGED_IDENTITY_ENABLED=true
      - GF_AZURE_MANAGED_IDENTITY_CLIENT_ID=${AZURE_CLIENT_ID}
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/etc/grafana/dashboard-templates:ro
      - grafana_dashboards:/var/lib/grafana/dashboards

volumes:
  dlq_agent_data:
  dlq_agent_reports:
  grafana_dashboards: